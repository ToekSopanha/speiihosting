[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "speiihosting"
version = "0.3.5"
description = "Cross-platform self-hosting CLI with isolated deployments and Cloudflare Tunnels"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "typer>=0.12,<1", "rich>=13,<15", "psutil>=5.9,<8",
  "pydantic>=2.7,<3", "httpx>=0.27,<1", "python-dotenv>=1,<2",
  "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1,<2", "ruff>=0.9,<1", "setuptools>=77", "wheel", "pip-audit>=2.9,<3"]
secrets = ["keyring>=25,<27"]

[project.scripts]
speiihos = "speiihosting.cli:main"
speiihosting = "speiihosting.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
speiihosting = ["binaries.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
