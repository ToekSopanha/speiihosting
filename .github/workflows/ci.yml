name: Checks
on:
  push:
  pull_request:
  schedule:
    - cron: '17 4 * * 1'
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.12', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Verify uv.lock is up to date
        run: uv lock --check
      - name: Install Python dependencies
        run: uv sync --locked --all-extras
      - run: uv run --locked ruff check src tests
      - run: uv run --locked ruff format --check src tests
      - run: uv run --locked python -m pytest -q
      - run: uv run --locked python -m build
      - name: Build npm launcher
        run: npm run build
      - name: Test npm launcher
        run: node --test tests/npm.test.cjs
        env:
          SPEIIHOSTING_PYTHON: ${{ matrix.os == 'windows-latest' && '.venv/Scripts/python.exe' || '.venv/bin/python' }}
      - run: npm pack --dry-run
      - name: Audit locked Python dependencies
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: uv run --locked pip-audit --strict --require-hashes -r requirements-dev.lock
